services:
  minecraft-server:
    image: itzg/minecraft-server:java21
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-25565}:25565"
    environment:
      # Minecraft
      EULA: ${EULA}
      TYPE: ${TYPE}
      VERSION: ${VERSION}

      # Server performance
      MEMORY: ${MEMORY}
      MAX_PLAYERS: ${MAX_PLAYERS}
      VIEW_DISTANCE: ${VIEW_DISTANCE}
      SIMULATION_DISTANCE: ${SIMULATION_DISTANCE}

      # Game config
      MOTD: ${MOTD}
      MODE: ${MODE}
      DIFFICULTY: ${DIFFICULTY}
      PVP: ${PVP}
      ONLINE_MODE: ${ONLINE_MODE}

      # Security
      ENABLE_WHITELIST: ${ENABLE_WHITELIST}
      ENFORCE_WHITELIST: ${ENFORCE_WHITELIST}
      WHITELIST: ${WHITELIST}
      OPS: ${OPS}

      # Rewrite Whitelist and OPs file if they exist and new users added to those lists.
      EXISTING_WHITELIST_FILE: SYNCHRONIZE
      EXISTING_OPS_FILE: SYNCHRONIZE

      # Remote console
      ENABLE_RCON: ${ENABLE_RCON}
      RCON_PASSWORD: ${RCON_PASSWORD}

      # Timezone
      TZ: ${TZ}

      # Icon
      ICON: ${ICON}
      OVERRIDE_ICON: ${OVERRIDE_ICON}

    mem_limit: ${MEMORY_LIMIT}

    volumes:
      - ./data:/data
      - ./mods:/mods:ro
      - ./icon/icon.png:/icon/icon.png:ro

    networks:
      - minecraft-network

    security_opt:
      - no-new-privileges:true
  backups:
    image: itzg/mc-backup
    container_name: minecraft-backup
    restart: unless-stopped
    depends_on:
      minecraft-server:
        condition: service_healthy
    environment:
      RCON_HOST: minecraft-server
      RCON_PORT: "25575" # Default port for remote console. DON'T CHANGE IT!
      RCON_PASSWORD: ${RCON_PASSWORD}
      BACKUP_NAME: ${BACKUP_NAME}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL}
      INITIAL_DELAY: ${INITIAL_DELAY}
      PRUNE_BACKUPS_DAYS: ${PRUNE_BACKUPS_DAYS}
      # Excludes, cache, logs, temp files and mods (.jar)
      EXCLUDES: "cache,logs,*.tmp,*.jar"
      TZ: ${TZ}
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    networks:
      - minecraft-network
    security_opt:
      - no-new-privileges:true
networks:
  minecraft-network:
    driver: bridge
