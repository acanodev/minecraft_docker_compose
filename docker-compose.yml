services:
  minecraft-server:
    image: itzg/minecraft-server:java17
    container_name: minecraft-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-25565}:25565"
    environment:
      # Minecraft
      - EULA: ${EULA}
      - TYPE: ${TYPE}
      - VERSION: ${VERSION}

      # Server performance
      - MEMORY: ${MEMORY}
      - MAX_PLAYERS: ${MAX_PLAYERS}
      - VIEW_DISTANCE: ${VIEW_DISTANCE}
      - SIMULATION_DISTANCE: ${SIMULATION_DISTANCE}

      # Game config
      - MOTD: ${MOTD}
      - MODE: ${MODE}
      - DIFFICULTY: ${DIFFICULTY}
      - PVP: ${PVP}
      - ONLINE_MODE: ${ONLINE_MODE}

      # Security
      - ENABLE_WHITELIST: ${ENABLE_WHITELIST}
      - ENFORCE_WHITELIST: ${ENFORCE_WHITELIST}
      - WHITELIST: ${WHITELIST}
      - OP: ${OP}

      # Remote console
      - ENABLE_RCON: ${ENABLE_RCON}
      - RCON_PASSWORD: ${RCON_PASSWORD}

      # Timezone
      - TZ: ${TZ}

    volumes:
      - minecraft-data:/data
      - minecraft-mods:/mods:ro

    networks:
      - minecraft-network

    security_opt:
      - no-new-privileges:true

volumes:
  minecraft-data:
    name: minecraft-data

  minecraft-mods:
    name: minecraft-mods

networks:
  minecraft-network:
    driver: bridge
